[tool.poetry]
name = "crypto-paper-trader-ml-api"
version = "0.2.2"
description = "Independent LightGBM walk-forward backtest API for Crypto Paper Trader."
authors = ["Roberto"]
readme = "README.md"
packages = [{ include = "crypto_paper_trader_ml_api", from = "src" }]
include = ["src/crypto_paper_trader_ml_api/seed/ml_parameters_seed.db"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.115,<1.0"
uvicorn = {version = ">=0.34,<1.0", extras = ["standard"]}
httpx = ">=0.28,<1.0"
pydantic = ">=2.10,<3.0"
pydantic-settings = ">=2.7,<3.0"
sqlalchemy = ">=2.0,<3.0"
pandas = ">=2.2,<4.0"
numpy = ">=2.0,<3.0"
scikit-learn = ">=1.6,<2.0"
lightgbm = ">=4.6,<5.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.25,<1.0"
ruff = ">=0.9,<1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
